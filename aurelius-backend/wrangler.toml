name = "aurelius-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# --- D1 database ---
# Created in the Cloudflare dashboard (or: wrangler d1 create aurelius-db).
# The id below is that database's; it identifies it but grants no access.
[[d1_databases]]
binding = "DB"
database_name = "aurelius-db"
database_id = "e7579201-d0fb-4c06-a6de-e5ce3defcdc9"
migrations_dir = "migrations"

# --- R2 bucket for video storage ---
# Create with: wrangler r2 bucket create aurelius-videos
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "aurelius-videos"

# --- secrets (set with `wrangler secret put NAME`, never put real values here) ---
# OTP_SECRET        - random string; keys the hashes of patient one-time codes
# SIGNING_KEY_JWK   - Ed25519 private key that signs certificates (npm run gen-signing-key)
# RESEND_API_KEY    - email delivery for links, one-time codes and reminders
# TURNSTILE_SECRET_KEY - Cloudflare Turnstile bot check before emailing a code
# For local dev, put these in .dev.vars (git-ignored) instead.

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://REPLACE_WITH_YOUR_DOMAIN"   # frontend + API share this origin; API is under /api
EMAIL_FROM = "Aurelius <no-reply@REPLACE_WITH_YOUR_DOMAIN>"
LINK_EXPIRY_HOURS = "48"
REMINDER_HOURS_BEFORE_EXPIRY = "12"

# --- Cron trigger: checks every 15 min for prescriptions crossing the
# 12h-remaining mark, and fires the doctor+patient reminder exactly once ---
[triggers]
crons = ["*/15 * * * *"]
